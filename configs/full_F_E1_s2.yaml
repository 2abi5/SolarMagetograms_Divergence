exp: F_E1_s2
stage: full
data_dir: data/full
split: splits/full.json
stats: data/full/stats.json
out_dir: results/full/F_E1_s2
model:
  name: highresnet
  kwargs:
    in_channels: 4
loss:
  weights:
    mse: 1.0
    grad: 0.0
    hist: 0.0
    ssim: 0.0
    div: 0.0
  div_mode: match
  hist_mode: tv
train:
  batch_size: 64
  lr: 0.0001
  max_epochs: 100
  patience: 10
  seed: 2
  num_workers: 4
  sampler: auto
  max_share: 0.25
  samples_per_epoch: 131072
data:
  mode: regions
  geometry: data/full/geometry_lr
  augment: true
  val_every: 3
